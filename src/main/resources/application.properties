spring.application.name=fashion-website
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api/v1
# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/fashion-website?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server & Logging
server.port=8080
logging.level.org.springframework.security=DEBUG

# Seed data
app.seed.default-password=${SEED_DEFAULT_PASSWORD:123456}

# JWT - khóa ký HS512 bắt buộc lấy từ biến môi trường (tối thiểu 64 byte)
jwt.signerKey=${JWT_SIGNER_KEY}
jwt.issuer=${JWT_ISSUER:fashion-website}
# Access token ngắn hạn (Short-lived: 15 phut = 900s), Refresh token: 7 ngay (don vi: giay)
jwt.valid-duration=900
jwt.refreshable-duration=604800

# CORS - danh sách origin frontend được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail Sender Name
app.mail.from-name=${MAIL_FROM_NAME:fashionwebsite}
