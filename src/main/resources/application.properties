spring.application.name=fashion-website
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api/v1
# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/fashion-website?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sapassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server & Logging
server.port=8080
logging.level.org.springframework.security=DEBUG

# Seed data
app.seed.default-password=${SEED_DEFAULT_PASSWORD:123456}
app.seed.enabled=${SEED_ENABLED:true}
app.seed.force=${SEED_FORCE:false}

# JWT - khóa ký HS512 bắt buộc lấy từ biến môi trường (tối thiểu 64 byte)
jwt.signerKey=${JWT_SIGNER_KEY}
jwt.issuer=${JWT_ISSUER:fashion-website}
# Access token ngắn hạn (Short-lived: 15 phut = 900s), Refresh token: 7 ngay (don vi: giay)
jwt.valid-duration=900
jwt.refreshable-duration=604800

# CORS - danh sách origin frontend được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail Sender Name
app.mail.from-name=${MAIL_FROM_NAME:fashionwebsite}

# Google OAuth2 Login
google.client-id=${GOOGLE_CLIENT_ID:}

# Spring AI - Google GenAI (Gemini). Key lay tu Google AI Studio, KHONG ghi cung (xem docs/README.md)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.retry.max-attempts=1
# =================================================================================
# MODULE CẤU HÌNH SPRING AI - GOOGLE GEMINI TEXT EMBEDDING (TẦNG 3: AI UNDERSTANDING)
# - Chức năng: Khai báo thông số kết nối tới dịch vụ Google Gemini Text Embedding.
# - Ý tưởng logic cốt lõi: Đọc giá trị từ biến môi trường (file .env); nếu chưa khai báo
#   thì tự động lấy giá trị mặc định sau dấu hai chấm (:) để ứng dụng luôn khởi động an toàn.
# - Đầu vào (Parameters): Các biến môi trường GEMINI_API_KEY, GEMINI_EMBEDDING_MODEL, GEMINI_EMBEDDING_DIMENSIONS.
# - Đầu ra (Return): Cấu hình hoàn chỉnh cho bean EmbeddingModel sinh vector 768 chiều.
# =================================================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:your_gemini_api_key_here}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}

# Cau hinh GHN
ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v3}
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
## Cau hinh Redis
# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms