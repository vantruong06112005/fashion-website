spring.application.name=fashion-website

# Nạp biến môi trường từ file .env ở thư mục gốc (file này KHÔNG commit lên Git)
# Mẫu các biến cần khai báo: xem .env.example
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/fashion-website?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server & Logging
server.port=8080
logging.level.org.springframework.security=DEBUG

# Seed data
app.seed.default-password=${SEED_DEFAULT_PASSWORD:123456}

# JWT - khóa ký HS512 bắt buộc lấy từ biến môi trường (tối thiểu 64 byte)
jwt.signerKey=${JWT_SIGNER_KEY}
jwt.issuer=${JWT_ISSUER:fashion-website}
# Access token ngắn hạn (Short-lived: 15 phut = 900s), Refresh token: 7 ngay (don vi: giay)
jwt.valid-duration=900
jwt.refreshable-duration=604800

# CORS - danh sách origin frontend được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB