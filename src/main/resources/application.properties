spring.application.name=fashion-website

# Database
spring.datasource.url=jdbc:mariadb://localhost:3306/fashion-website
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
logging.level.org.springframework.security=DEBUG 
#key
jwt.signerKey=59a7cd85af4c99bea27a6518cbdb866000967e4170222736e641e209b482c9a0
# Access token ngắn hạn (Short-lived: 15 phut = 900s), Refresh token: 7 ngay (don vi: giay)
jwt.valid-duration=900
jwt.refreshable-duration=604800

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB